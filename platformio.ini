; Brain Candy – Logikrätsel für Waveshare ESP32-S3-Touch-AMOLED-1.8 (V2) und -2.16
; Der Simulator baut über sim/Makefile, nicht über PlatformIO.
;   pio run -e amoled18 -t upload    AMOLED-1.8 (V2)
;   pio run -e amoled216 -t upload   AMOLED-2.16 (480×480, das Spiel liegt mittig)

[platformio]
src_dir = firmware
default_envs = amoled18

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip   ; Arduino-Core 3.3 (stable mit Core 4.0 bricht GFX 1.6.8)
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -I core
    -I game
    -DESP32QSPI_MAX_PIXELS_AT_ONCE=4096
build_unflags = -std=gnu++11
build_src_filter = +<*> +<../core/*.cpp> +<../game/*.cpp>
board_build.embed_files = firmware/voice.bin   ; Sprach-Clips (tools/mkvoice.py)
lib_deps =
    moononournation/GFX Library for Arduino@1.6.8
monitor_speed = 115200
upload_speed = 921600

[env:amoled18]

[env:amoled216]
build_flags =
    ${env.build_flags}
    -DBOARD_AMOLED216
lib_deps =
    ${env.lib_deps}
    lewisxhe/SensorLib@0.3.3
    lewisxhe/XPowersLib@0.2.6
